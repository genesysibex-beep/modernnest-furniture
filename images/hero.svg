<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a cozy modern living room with a sofa, plant, and window" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="600" height="600" fill="#EFEADF"/>
  <rect x="0" y="0" width="600" height="600" fill="#647A5B" opacity="0.08"/>
  <g fill="none" stroke="#2A2723" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- window -->
    <rect x="360" y="60" width="180" height="220" rx="6" fill="#F6F3EC"/>
    <line x1="450" y1="60" x2="450" y2="280"/>
    <line x1="360" y1="170" x2="540" y2="170"/>
    <!-- floor line -->
    <line x1="0" y1="470" x2="600" y2="470" stroke="#B9AF9B"/>
    <!-- rug -->
    <ellipse cx="260" cy="500" rx="220" ry="40" fill="#D9CBAE" stroke="none"/>
    <!-- sofa -->
    <rect x="70" y="330" width="330" height="110" rx="18" fill="#566B4E"/>
    <rect x="70" y="290" width="330" height="60" rx="20" fill="#647A5B"/>
    <rect x="60" y="280" width="46" height="140" rx="16" fill="#3E4F39"/>
    <rect x="360" y="280" width="46" height="140" rx="16" fill="#3E4F39"/>
    <rect x="120" y="315" width="90" height="55" rx="12" fill="#EFEADF" stroke="none"/>
    <rect x="220" y="315" width="90" height="55" rx="12" fill="#EFEADF" stroke="none"/>
    <line x1="95" y1="440" x2="95" y2="465"/>
    <line x1="150" y1="440" x2="150" y2="465"/>
    <line x1="320" y1="440" x2="320" y2="465"/>
    <line x1="375" y1="440" x2="375" y2="465"/>
    <!-- side table -->
    <rect x="420" y="400" width="90" height="14" rx="4" fill="#8C6A45"/>
    <line x1="435" y1="414" x2="435" y2="460"/>
    <line x1="495" y1="414" x2="495" y2="460"/>
    <!-- lamp -->
    <path d="M455 340 L475 380 L435 380 Z" fill="#B4652A" stroke="none"/>
    <line x1="455" y1="380" x2="455" y2="400"/>
    <!-- plant -->
    <path d="M110 250 C90 220 90 190 110 165 C120 200 120 220 110 250 Z" fill="#566B4E" stroke="none"/>
    <path d="M110 250 C130 210 145 190 165 175 C155 210 140 230 110 250 Z" fill="#647A5B" stroke="none"/>
    <path d="M110 250 C95 215 80 195 60 180 C75 215 88 235 110 250 Z" fill="#3E4F39" stroke="none"/>
    <path d="M100 245 h20 l6 45 h-32 z" fill="#8C6A45"/>
  </g>
</svg>
